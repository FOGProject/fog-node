version: 2
updates:
  # Every bump runs tests.yml before it can merge. auto-merge skips Dependabot,
  # so a person queues each bump.
  # The "comments" block in package.json explains the overrides, and why the
  # grunt/Babel 6 build chain keeps some advisories that no bump can fix.
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # Each DataTables extension needs a matching core version. Scroller 3.x
    # alone (PR #110) broke every page, because the core was still 2.x. One
    # grouped PR moves them together.
    groups:
      datatables:
        patterns:
          - "datatables.net*"
    # The 3.x extensions need DataTables core 3.1, and the core is not a direct
    # dependency, so the group cannot bump it (PR #121 broke every page). Hold
    # the majors until #118 moves the core and the extensions together, then
    # delete this rule.
    ignore:
      - dependency-name: "datatables.net*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
