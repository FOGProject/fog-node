version: 2
updates:
  # Every bump runs tests.yml before it can merge. auto-merge skips Dependabot,
  # so a person queues each bump.
  # The "comments" block in package.json explains the overrides, and why the
  # grunt/Babel 6 build chain keeps some advisories that no bump can fix.
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # Each DataTables extension needs a matching core version. Scroller 3.x
    # alone (PR #110) broke every page, because the core was still 2.x. One
    # grouped PR moves them together. The core (datatables.net,
    # datatables.net-bs4) is a direct dependency so the group can bump it too.
    groups:
      datatables:
        patterns:
          - "datatables.net*"
    ignore:
      # 3.x is ESM-only and needs a reflect polyfill; fog-node is CommonJS
      # (PR #215 failed every job). Issue #219 tracks the move. Remove this
      # rule in the PR that closes it.
      - dependency-name: "@peculiar/x509"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
