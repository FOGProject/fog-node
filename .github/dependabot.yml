version: 2
updates:
  # Every bump runs through tests.yml and the merge queue before it lands.
  # The "comments" block in package.json explains the overrides, and why the
  # grunt/Babel 6 build chain keeps some advisories that no bump can fix.
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
