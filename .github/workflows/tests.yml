name: Tests

# Runs the whole `npm test` (eslint, then the mocha suite) and the browser UI
# smoke test (`npm run test:ui`) on every pull request and on every
# merge-queue entry. The `master` ruleset requires the
# job names below, so renaming a job means editing that ruleset in the same
# change, or every pull request waits for a check that never reports.
#
# The logic lives here, not in a reusable workflow in FOGProject/fog-workflows.
# fogproject uses fog-workflows because several long-lived branches each carry
# a stub. This repository has one long-lived branch. A second repository would
# add a cross-repo edit to every CI change and give nothing back. Move the
# logic when a second long-lived branch appears.
#
# No push trigger: nothing here needs to run after the merge, and the merge
# queue already ran the suite on the exact tree that lands.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two majors the README supports.
        node: ['22', '26']

    # The suite lifts a real Sails app. It needs MongoDB (the datastore) and
    # Redis (the session store: CSRF keeps its secret in the session).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --legacy-peer-deps: chart.js@4 conflicts with an old plugin's peer
      # range, and the repository has always installed this way.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # setup:dev writes the git-ignored config/local.js and config/models.js.
      # Its localhost defaults match the two service containers above.
      - name: Configure (dev setup)
        run: npm run setup:dev

      - name: npm test
        run: npm test

  # `npm test` never builds or loads the UI, so a UI dependency bump can break
  # every page and still pass it (Dependabot PR #110 did). This job lifts
  # fog-node with the dev asset build and drives Chromium through the pages
  # (tools/smoke/ui.js). The browser runs the same on every server OS, so one
  # Linux job covers it. The services and the first steps mirror the `test`
  # job; change both together.
  ui:
    name: ui smoke (Node 22)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # The Chromium build that matches the installed Playwright version, and
      # the system libraries that it needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure (dev setup)
        run: npm run setup:dev

      - name: UI smoke test
        run: npm run test:ui

      # A screenshot of each failed page.
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-screenshots
          path: ui-smoke-out/
          if-no-files-found: ignore

  # fog-node runs on any OS that runs Node, so CI proves one non-Linux OS too.
  # Windows is the one that differs most: npm runs package scripts through
  # cmd.exe, so a POSIX-only script (VAR=value, ./path) fails here first.
  # Service containers need Linux, so MongoDB and Redis run natively instead.
  windows:
    name: tests (Windows, Node 22)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # The runner image ships MongoDB 7.0 as a disabled Windows service.
      - name: Start MongoDB
        shell: pwsh
        run: |
          Set-Service -Name MongoDB -StartupType Manual
          Start-Service -Name MongoDB

      # Redis has no official Windows build. Memurai is a Redis-compatible
      # Windows service, and its installer starts it on port 6379.
      # The Chocolatey community feed sometimes answers 504, so retry. Then
      # check the port, so a failed install fails here and not later as
      # ECONNREFUSED in setup:dev.
      - name: Install Redis (Memurai)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install memurai-developer -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          if (-not (Test-NetConnection 127.0.0.1 -Port 6379 -InformationLevel Quiet)) {
            throw 'Memurai is not listening on port 6379.'
          }

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure (dev setup)
        run: npm run setup:dev

      - name: npm test
        run: npm test
